name: Checkov
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push to a pull request cancels that PR's older queued or running scans.
# Pushes to main are never cancelled, so every commit on main gets scanned.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checkov:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # Actions are pinned to commit SHAs; Dependabot updates the SHA and version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test with Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39 # v12.3142.0
        with:
          directory: .
          # Hard-coded secrets in any file, and insecure patterns in these workflows.
          # Add frameworks (for example terraform, cloudformation, kubernetes, dockerfile)
          # when a blueprint ships infrastructure code.
          framework: secrets,github_actions
          # This will add both a CLI output to the console and create a results.sarif file
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - name: Expose report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: SARIF results
          path: results.sarif
      # Uploads results.sarif to the repository's code scanning alerts.
      # Runs on success or failure so failed checks are still reported.
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: success() || failure()
        with:
          sarif_file: results.sarif
