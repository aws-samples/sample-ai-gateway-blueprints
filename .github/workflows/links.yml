name: Links
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Weekly run catches external pages that move or disappear between commits.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; Dependabot updates the SHA and version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Checks external URLs and relative links between files in every Markdown file.
      # 429 (rate limited) is accepted so busy doc sites do not fail the build.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            './**/*.md'
          fail: true
