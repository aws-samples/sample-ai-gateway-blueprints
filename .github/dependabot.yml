# Dependabot version updates.
# Each entry needs a unique package-ecosystem + directory pair; a duplicate
# makes the whole file invalid and Dependabot runs nothing.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # GitHub Actions used in .github/workflows (directory "/" means the default location)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python packages pinned in requirements.txt, including litellm. The Python
  # workflow's mock test fails a litellm bump that changes the documented retry
  # and fallback behaviour, so review those PRs before merging.
  - package-ecosystem: "pip"
    directory: "/Litellm/LiteLLM-routing-fallback-529-503"
    schedule:
      interval: "weekly"
    ignore:
      # 3.11+ drops Python 3.10, which the sample supports.
      - dependency-name: "matplotlib"
        versions: [">=3.11"]

  # Strands agent clients of the LiteLLM MCP gateway sample (both options pin the same versions).
  - package-ecosystem: "pip"
    directories:
      - "/Litellm/litellm-mcp-gateway/option-a-enterprise-idp/client"
      - "/Litellm/litellm-mcp-gateway/option-b-virtual-key/client"
    schedule:
      interval: "weekly"
    groups:
      mcp-gateway-client:
        patterns: ["*"]
    ignore:
      # strands-agents 1.67 requires mcp < 2.4 and litellm < 1.107. Remove these once a
      # strands-agents release accepts newer versions.
      - dependency-name: "mcp"
        versions: [">=2.4"]
      - dependency-name: "litellm"
        versions: [">=1.107"]

  # Terraform providers of the LiteLLM MCP gateway infrastructure (.terraform.lock.hcl).
  - package-ecosystem: "terraform"
    directory: "/Litellm/litellm-mcp-gateway/infra/terraform"
    schedule:
      interval: "weekly"
