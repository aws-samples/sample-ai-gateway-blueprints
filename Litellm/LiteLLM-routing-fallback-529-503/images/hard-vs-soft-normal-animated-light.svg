<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -34 1300 504" role="img" aria-label="Hard-EU vs Soft-EU routing under normal operation" width="1300" height="504" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
      
      <title>Hard-EU vs Soft-EU routing under normal operation</title><desc>Hard-EU sends all traffic from the app through two EU entry Regions to the eu. profile, served from eu-north-1 with one warm cache; other geographies are idle. Soft-EU sends weighted traffic at the same time to EU, US, Japan, and Australia entry Regions, each entering its own geography, keeping up to four warm caches. Global is fallback only.</desc><style>
.flow{fill:none;stroke-width:2.4;stroke-dasharray:9 7;stroke-linecap:round;
  animation:flow 1s linear infinite}
.flow.slow{animation-duration:1.9s;stroke-dasharray:7 9;opacity:.9}
.flow.dead{animation:none;opacity:.35}
@keyframes flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
</style><defs><marker id="a-4ea3f5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0972d3" /></marker><marker id="a-5fcf80" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7a32" /></marker><marker id="a-8b7cf6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6842e0" /></marker><marker id="a-e8a13a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a5c00" /></marker></defs><rect x="0" y="-34" width="1300" height="504" fill="#ffffff" /><g><rect x="12" y="-28" width="162.6" height="24" rx="7" fill="#ffffff" stroke="#1a7a32" /><text x="23" y="-11" fill="#1a7a32" font-size="12.5" font-weight="700">Normal (EU healthy)</text></g><text x="320" y="22" text-anchor="middle" fill="#1a7a32" font-size="15" font-weight="700">HARD-EU  ·  “EU unless EU is down”</text>
      <text x="965" y="22" text-anchor="middle" fill="#0972d3" font-size="15" font-weight="700">SOFT-EU  ·  weighted bias (~63% EU)</text>
      <line x1="645" y1="34" x2="645" y2="454" stroke="#d5dbe3" stroke-dasharray="4 6" />
      <text x="320" y="40" text-anchor="middle" fill="#5f6b7a" font-size="9.5">each geo is entered from a Region INSIDE that geo (profile is invalid otherwise)</text>
      <text x="965" y="40" text-anchor="middle" fill="#5f6b7a" font-size="9.5">each geo is entered from a Region INSIDE that geo (profile is invalid otherwise)</text>

      
      <rect x="20" y="210" width="78" height="56" rx="12" fill="#f2f4f7" stroke="#8d99a8" />
      <text x="59" y="243" text-anchor="middle" fill="#16191f" font-size="13" font-weight="700">App</text>

      
      <rect x="150" y="196" width="150" height="38" rx="9" fill="#ebf7ee" stroke="#1a7a32" />
      <text x="225" y="213" text-anchor="middle" fill="#16191f" font-size="10.5" font-weight="700">entry eu-central-1</text>
      <text x="225" y="227" text-anchor="middle" fill="#5f6b7a" font-size="8.5">EU region · session A</text>
      <rect x="150" y="240" width="150" height="38" rx="9" fill="#ebf7ee" stroke="#1a7a32" />
      <text x="225" y="257" text-anchor="middle" fill="#16191f" font-size="10.5" font-weight="700">entry eu-west-1</text>
      <text x="225" y="271" text-anchor="middle" fill="#5f6b7a" font-size="8.5">EU region · session B</text>

      
      <rect x="380" y="206" width="150" height="64" rx="12" fill="#ebf7ee" stroke="#1a7a32" stroke-width="2.4" id="hardEuPool" />
      <text x="455" y="228" text-anchor="middle" fill="#16191f" font-size="12.5" font-weight="700">eu. → eu-north-1</text>
      <text x="455" y="245" text-anchor="middle" fill="#1a7a32" font-size="10" id="hardEuPoolStatus">serving · 1 warm cache</text>
      <text x="455" y="260" text-anchor="middle" fill="#5f6b7a" font-size="9">primary</text>
      <path class="hard-eu-path flow" d="M98,232 C120,232 128,215 150,215" stroke="#1a7a32" marker-end="url(#a-5fcf80)" />
      <path class="hard-eu-path flow" d="M98,240 C120,240 128,259 150,259" stroke="#1a7a32" marker-end="url(#a-5fcf80)" />
      
      <path class="hard-eu-path flow" d="M300,215 C340,215 345,232 380,234" stroke="#1a7a32" marker-end="url(#a-5fcf80)" />
      <path class="hard-eu-path flow" d="M300,259 C340,259 345,244 380,242" stroke="#1a7a32" marker-end="url(#a-5fcf80)" />
      
      <rect x="680" y="210" width="78" height="56" rx="12" fill="#f2f4f7" stroke="#8d99a8" />
      <text x="719" y="243" text-anchor="middle" fill="#16191f" font-size="13" font-weight="700">App</text>

      
      <rect x="810" y="62" width="150" height="34" rx="8" fill="#ebf7ee" stroke="#1a7a32" />
      <text x="885" y="77" text-anchor="middle" fill="#16191f" font-size="10" font-weight="700">entry eu-central-1</text>
      <text x="885" y="90" text-anchor="middle" fill="#5f6b7a" font-size="8">EU · w=10</text>
      <rect x="810" y="120" width="150" height="34" rx="8" fill="#e9f2fd" stroke="#0972d3" />
      <text x="885" y="135" text-anchor="middle" fill="#16191f" font-size="10" font-weight="700">entry us-east-1</text>
      <text x="885" y="148" text-anchor="middle" fill="#5f6b7a" font-size="8">US · w=3</text>
      <rect x="810" y="178" width="150" height="34" rx="8" fill="#f0edfd" stroke="#6842e0" />
      <text x="885" y="193" text-anchor="middle" fill="#16191f" font-size="10" font-weight="700">entry ap-northeast-1</text>
      <text x="885" y="206" text-anchor="middle" fill="#5f6b7a" font-size="8">JP · w=2</text>
      <rect x="810" y="236" width="150" height="34" rx="8" fill="#fdf3e4" stroke="#9a5c00" />
      <text x="885" y="251" text-anchor="middle" fill="#16191f" font-size="10" font-weight="700">entry ap-southeast-2</text>
      <text x="885" y="264" text-anchor="middle" fill="#5f6b7a" font-size="8">APAC · w=1</text>
      <rect x="810" y="300" width="150" height="34" rx="8" fill="#f7f8fa" stroke="#a83aa8" />
      <text x="885" y="315" text-anchor="middle" fill="#5f6b7a" font-size="10" font-weight="700">entry (any) → global.</text>
      <text x="885" y="328" text-anchor="middle" fill="#5f6b7a" font-size="8">fallback only</text>

      
      <rect x="1040" y="62" width="160" height="34" rx="8" fill="#ebf7ee" stroke="#1a7a32" id="softEuBox" />
      <text x="1120" y="83" text-anchor="middle" fill="#16191f" font-size="10.5" font-weight="700" id="softEuLabel">eu. → eu-north-1</text>
      <rect x="1040" y="120" width="160" height="34" rx="8" fill="#e9f2fd" stroke="#0972d3" />
      <text x="1120" y="141" text-anchor="middle" fill="#16191f" font-size="10.5" font-weight="700">us. → us-east-1</text>
      <rect x="1040" y="178" width="160" height="34" rx="8" fill="#f0edfd" stroke="#6842e0" />
      <text x="1120" y="199" text-anchor="middle" fill="#16191f" font-size="10.5" font-weight="700">jp. → ap-northeast-1</text>
      <rect x="1040" y="236" width="160" height="34" rx="8" fill="#fdf3e4" stroke="#9a5c00" />
      <text x="1120" y="257" text-anchor="middle" fill="#16191f" font-size="10.5" font-weight="700">au. → ap-southeast-4</text>
      <rect x="1040" y="300" width="160" height="34" rx="8" fill="#fbecfb" stroke="#a83aa8" />
      <text x="1120" y="321" text-anchor="middle" fill="#16191f" font-size="10.5" font-weight="700">global. → worldwide</text>

      
      <path class="soft-eu-path flow" d="M758,232 C778,160 792,79  810,79" stroke="#1a7a32" marker-end="url(#a-5fcf80)" />
      <path class="soft-weighted flow" d="M758,236 C778,190 792,137 810,137" stroke="#0972d3" marker-end="url(#a-4ea3f5)" />
      <path class="soft-weighted flow" d="M758,240 C778,210 792,195 810,195" stroke="#6842e0" marker-end="url(#a-8b7cf6)" />
      <path class="soft-weighted flow" d="M758,244 C778,250 792,253 810,253" stroke="#9a5c00" marker-end="url(#a-e8a13a)" />
      <path class="soft-eu-path flow" d="M960,79  L1040,79" stroke="#1a7a32" marker-end="url(#a-5fcf80)" />
      <path class="soft-weighted flow" d="M960,137 L1040,137" stroke="#0972d3" marker-end="url(#a-4ea3f5)" />
      <path class="soft-weighted flow" d="M960,195 L1040,195" stroke="#6842e0" marker-end="url(#a-8b7cf6)" />
      <path class="soft-weighted flow" d="M960,253 L1040,253" stroke="#9a5c00" marker-end="url(#a-e8a13a)" />
      <text x="320" y="446" text-anchor="middle" fill="#5f6b7a" font-size="11" id="hard-cap">Normal: 100% EU · one warm cache · other geos idle</text>
      <text x="965" y="446" text-anchor="middle" fill="#5f6b7a" font-size="11" id="soft-cap">Normal: EU + US + JP + AU all active (weighted) · up to 4 warm caches</text>
    </svg>
