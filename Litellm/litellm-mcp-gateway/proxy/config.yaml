# LiteLLM proxy config: governed, per-user MCP access to Confluence (Atlassian MCP server v2)
# Community edition. No Enterprise license required.

model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: bedrock/eu.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_region_name: eu-west-1   # credentials come from the ECS task role

mcp_servers:
  atlassian_confluence_read:
    url: "https://mcp.atlassian.com/v2/mcp?tools=all"   # flat tool list for gateways
    transport: "http"
    auth_type: "none"              # gateway holds no Confluence credential
    extra_headers: ["Authorization"]  # forward the caller's user token upstream
    description: "Confluence, read-only, acts as the calling user"
    allowed_tools:
      - listConfluenceSpaces
      - getConfluenceContent
      - listConfluenceContent
      - getAccessibleAtlassianResources
      - atlassianUserInfo
    access_groups:
      - confluence_read

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # from AWS Secrets Manager
  database_url: os.environ/DATABASE_URL       # Aurora PostgreSQL
  store_model_in_db: true

litellm_settings:
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: 6379
